plugins:
  - rubocop-rspec
  - rubocop-rails

Lint/MissingSuper:
  Exclude:
    - app/components/**/*.rb

Metrics/BlockLength:
  Exclude:
    - spec/**/*

Metrics/MethodLength:
  Exclude:
    - spec/dummy/db/migrate/**

Metrics/ClassLength:
  Exclude:
    - spec/dummy/db/migrate/**

Metrics/AbcSize:
  Exclude:
    - lib/generators/**/*.rb
    - spec/dummy/db/migrate/**

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 5

RSpec/ExampleLength:
  Max: 15

RSpec/MessageSpies:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/SpecFilePathFormat:
  Exclude:
    - spec/tramway/helpers/views_helpers/*_spec.rb

Gemspec/RequiredRubyVersion:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Rails/HasManyOrHasOneDependent:
  Enabled: false

# SolidQueue::Queue is a plain Ruby class (not ActiveRecord), so it only exposes its own
# `find_by_name` method, not the ActiveRecord dynamic finder this cop assumes.
Rails/DynamicFindBy:
  Exclude:
    - app/controllers/tramway/plugins/solid_queue/queues_controller.rb
    - spec/requests/tramway/plugins/solid_queue/queues_spec.rb

Style/ItBlockParameter:
  Enabled: false

Style/Documentation:
  Exclude:
    - lib/generators/tramway/install/font_awesome_helpers.rb
    - spec/**/*

RSpec/AnyInstance:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
